#
# Ryū OS installer (Calamares). Installed as /etc/calamares/settings.conf.
#
# The live image is copied as-is from the read-only squashfs (/run/ryu/lower): the live
# session's own changes never reach the installed system. The installer then creates the
# real account, removes the temporary "ryu" one and installs GRUB.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: ryupost
  module: shellprocess
  config: shellprocess-ryupost.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - removeuser
  - hwclock
  - shellprocess@ryupost
  - bootloader
  - umount
- show:
  - finished

branding: ryu
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
