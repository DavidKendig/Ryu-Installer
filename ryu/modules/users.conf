---
# The same groups as the live "ryu" account: wheel (sudo), seat access for the desktop,
# graphics, input and sound.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: true
      system: true
    - name: _seatd
      must_exist: true
      system: true
    - video
    - input
    - audio
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: false
user:
    shell: /bin/bash
    forbidden_names: [ root, ryu ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "ryu-${cpu}"
    forbidden_names: [ localhost ]
presets:
    fullName:
        editable: true
